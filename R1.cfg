hostname R1
!
interface GigabitEthernet0/0/0
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 no shutdown
!
interface GigabitEthernet0/1
 no ip address
 no shutdown
!
interface GigabitEthernet0/1.10
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 ip nat inside
 ip helper-address 10.10.100.2
!
interface GigabitEthernet0/1.20
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
 ip nat inside
 ip helper-address 10.10.100.2
!
interface GigabitEthernet0/1.30
 encapsulation dot1Q 30
 ip address 10.10.30.1 255.255.255.0
 ip nat inside
 ip helper-address 10.10.100.2
!
interface GigabitEthernet0/1.100
 encapsulation dot1Q 100
 ip address 10.10.100.1 255.255.255.0
 ip nat inside
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
ip nat pool INET-POOL 203.0.113.2 203.0.113.2 netmask 255.255.255.252
ip nat inside source list NAT-ACL pool INET-POOL overload
!
ip access-list standard NAT-ACL
 permit 10.10.10.0 0.0.0.255
 permit 10.10.20.0 0.0.0.255
 permit 10.10.30.0 0.0.0.255
 permit 10.10.100.0 0.0.0.255
